# Builds HighPen on GitHub Actions and, once SignPath is set up, code-signs it.
# Pushing a tag like v1.2.1 also publishes a GitHub release with the two .exe files.
#
# Signing is skipped until the repository variable SIGNPATH_ORGANIZATION_ID and the
# secret SIGNPATH_API_TOKEN exist (see .signpath/README.md).
#
# The installer embeds HighPen.exe, so signing happens in two rounds:
#   build app -> sign app -> build installer around the signed app -> sign installer

name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release
  actions: read     # SignPath downloads the unsigned artifacts

env:
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'high-pen' }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $m = Select-String -Path src/HighPen.cs -Pattern 'AppVersion = "([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match AppVersion $v in src/HighPen.cs" }

      - name: Build app
        run: ./build.ps1 -Target app

      # ---- sign HighPen.exe ----
      - name: Upload unsigned app
        id: upload-app
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: HighPen-app-unsigned
          path: dist/HighPen.exe

      - name: Sign app
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # time for a manual approval in SignPath
          output-artifact-directory: signed-app

      - name: Use signed app
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: Copy-Item signed-app/HighPen.exe dist/HighPen.exe -Force

      # ---- build and sign the installer ----
      - name: Build installer
        run: ./build.ps1 -Target setup

      - name: Upload unsigned installer
        id: upload-setup
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: HighPen-setup-unsigned
          path: dist/HighPen-Setup.exe

      - name: Sign installer
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Use signed installer
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: Copy-Item signed-setup/HighPen-Setup.exe dist/HighPen-Setup.exe -Force

      # ---- publish ----
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HighPen
          path: |
            dist/HighPen.exe
            dist/HighPen-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/HighPen-Setup.exe dist/HighPen.exe --title "HighPen $env:GITHUB_REF_NAME" --generate-notes
